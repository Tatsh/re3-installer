concurrency:
  cancel-in-progress: false
  group: '${{ github.workflow }}-${{ github.ref }}'
  queue: 'max'
jobs:
  build-cross:
    name: 'Build (MinGW cross)'
    permissions:
      attestations: write
      contents: write
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - name: Set up MinGW
        uses: egor-tensin/setup-mingw@41b837e47d7f85214629d255b9c4bc3fcbe9fd63
        with:
          platform: x64
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - env:
          BUILD_TYPE: '${{ matrix.build-type }}'
        name: Build unshield
        run: |
          curl -Lo 'zlib.tar.gz' \
            'https://github.com/madler/zlib/releases/download/v1.3.1/zlib-1.3.1.tar.gz'
          tar xf zlib.tar.gz
          cd zlib-1.3.1 || exit 1
          mkdir build
          cmake -B ./build -DCMAKE_BUILD_TYPE="${BUILD_TYPE}" \
            -DBUILD_SHARED_LIBS=OFF \
            -DCMAKE_INSTALL_PREFIX="${GITHUB_WORKSPACE}"/build/prefix \
            -DCMAKE_BUILD_WITH_INSTALL_RPATH=ON -DCMAKE_C_COMPILER=x86_64-w64-mingw32-gcc \
            -DCMAKE_CXX_COMPILER=x86_64-w64-mingw32-g++ -DCMAKE_SYSTEM_NAME=Windows -Wno-dev
          cmake --build ./build --config "${BUILD_TYPE}" --verbose
          cmake --install ./build --config "${BUILD_TYPE}" --verbose
          cd .. || exit 1
          curl -Lo 'unshield.tar.gz' 'https://github.com/twogood/unshield/archive/refs/tags/1.6.2.tar.gz'
          tar xf unshield.tar.gz
          cd unshield-1.6.2 || exit 1
          sed -i 's/defined(UNSHIELD_EXPORTS)/defined(UNSHIELD_EXPORT)/' lib/libunshield.h
          mkdir build
          cmake -B ./build -DCMAKE_BUILD_TYPE="${BUILD_TYPE}" \
            -DBUILD_STATIC=ON -DCMAKE_INTERPROCEDURAL_OPTIMIZATION=TRUE \
            -DCMAKE_INSTALL_PREFIX="${GITHUB_WORKSPACE}"/build/prefix \
            -DCMAKE_BUILD_WITH_INSTALL_RPATH=ON -DCMAKE_C_COMPILER=x86_64-w64-mingw32-gcc \
            -DCMAKE_CXX_COMPILER=x86_64-w64-mingw32-g++ -DCMAKE_SYSTEM_NAME=Windows -Wno-dev
          cmake --build ./build --config "${BUILD_TYPE}" --verbose
          cmake --install ./build --config "${BUILD_TYPE}" --verbose
      - name: Build libcdio
        run: |
          curl -Lo 'libcdio.tar.gz' 'https://github.com/libcdio/libcdio/releases/download/2.3.0/libcdio-2.3.0.tar.gz'
          tar xf libcdio.tar.gz
          cd libcdio-2.3.0 || exit 1
          mkdir build
          ./configure --prefix="${GITHUB_WORKSPACE}"/build/prefix \
            --enable-static \
            --disable-shared \
            --host=x86_64-w64-mingw32 --build=x86_64-pc-linux-gnu \
            --without-cd-drive \
            --without-cd-info \
            --without-cdda-player \
            --without-cd-read \
            --without-iso-info \
            --without-iso-read \
            --disable-cxx \
            --disable-cpp-progs \
            --disable-example-progs
          make -j"$(nproc)"
          make install
          cd .. || exit 1
      - env:
          BUILD_TYPE: '${{ matrix.build-type }}'
        name: Configure
        run: >-
          cmake -B "${GITHUB_WORKSPACE}"/build
          -DBUILD_STATIC=ON
          -DCMAKE_INSTALL_PREFIX="${GITHUB_WORKSPACE}"/build/prefix
          -DCMAKE_PREFIX_PATH="${GITHUB_WORKSPACE}"/build/prefix
          -DCMAKE_BUILD_TYPE="${BUILD_TYPE}"
          -DCMAKE_BUILD_WITH_INSTALL_RPATH=ON -DCMAKE_C_COMPILER=x86_64-w64-mingw32-gcc
          -DCMAKE_CXX_COMPILER=x86_64-w64-mingw32-g++ -DCMAKE_SYSTEM_NAME=Windows
      - env:
          BUILD_TYPE: '${{ matrix.build-type }}'
        name: Build
        run: cmake --build "${GITHUB_WORKSPACE}"/build --config "${BUILD_TYPE}" --verbose
      - env:
          BUILD_TYPE: '${{ matrix.build-type }}'
        name: Install
        run: cmake --install "${GITHUB_WORKSPACE}"/build --config "${BUILD_TYPE}" --verbose
      - env:
          BUILD_TYPE: '${{ matrix.build-type }}'
        name: Package
        run: >-
          cpack -C "${BUILD_TYPE}"
          --config "${GITHUB_WORKSPACE}"/build/CPackConfig.cmake --verbose
      - if: "matrix.build-type == 'Release'"
        name: 'Check for debug runtime linkage'
        run: |
          $markers = @(
            'VCRUNTIME140D',
            'MSVCP140D',
            'VCOMP140D',
            'CONCRT140D',
            'VCCORLIB140D',
            'ucrtbased',
            'MSVCRTD',
            'MSVCPRTD'
          )
          $zip = (Get-ChildItem re3-installer-*-Release.zip | Select-Object -First 1).FullName
          Expand-Archive -Path $zip -DestinationPath debugcheck -Force
          $binaries = @(Get-ChildItem debugcheck -Recurse -Include *.dll, *.exe)
          if ($binaries.Count -eq 0) {
            Write-Host "::error::No binaries were found in $zip."
            exit 1
          }
          $failed = $false
          $binaries | ForEach-Object {
            $bytes = [System.IO.File]::ReadAllBytes($_.FullName)
            $text = [System.Text.Encoding]::ASCII.GetString($bytes)
            foreach ($marker in $markers) {
              if ($text.Contains($marker)) {
                Write-Host "::error::$($_.Name) references debug runtime $marker."
                $failed = $true
              }
            }
          }
          if ($failed) {
            exit 1
          }
        shell: pwsh
      - name: 'Upload Artifacts'
        uses: 'actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a'
        with:
          if-no-files-found: error
          name: re3-installer-cross-${{ matrix.build-type }}
          path: |
            ${{github.workspace}}/re3-installer-*.zip
      - name: Attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-path: |
            ${{github.workspace}}/re3-installer-*.zip
      - env:
          GH_TOKEN: ${{ github.token }}
        if: ${{ github.ref_type == 'tag' && matrix.build-type == 'Release' }}
        name: Upload package
        run: |
          shopt -s nullglob
          files=("${GITHUB_WORKSPACE}"/re3-installer-*.zip)
          if [[ ${#files[@]} -eq 0 ]]; then
            echo '::error::No package files were found to upload.'
            exit 1
          fi
          if ! gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --draft --generate-notes \
              --title "$GITHUB_REF_NAME" || true
          fi
          gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber
    strategy:
      fail-fast: false
      matrix:
        build-type: [Debug, Release]
  build-linux:
    name: 'Build (Linux)'
    permissions:
      attestations: write
      contents: write
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: install deps
        run: |
          sudo apt-get update -y -qq
          sudo apt-get install -y libunshield-dev libcdio-dev libiso9660-dev
      - env:
          BUILD_TYPE: '${{ matrix.build-type }}'
        name: Configure
        run: |
          cmake -S . -B build -DCMAKE_VERBOSE_MAKEFILE=ON \
            -DCMAKE_BUILD_TYPE="${BUILD_TYPE}" \
            -DCMAKE_INSTALL_PREFIX="${GITHUB_WORKSPACE}"/build/AppDir/usr
      - env:
          BUILD_TYPE: '${{ matrix.build-type }}'
        name: Build
        run: cmake --build "${GITHUB_WORKSPACE}"/build --config "${BUILD_TYPE}" --verbose
      - env:
          BUILD_TYPE: '${{ matrix.build-type }}'
        name: Install
        run: cmake --install "${GITHUB_WORKSPACE}"/build --config "${BUILD_TYPE}" --verbose
      - env:
          BUILD_TYPE: '${{ matrix.build-type }}'
        name: Package
        run: >-
          cpack -C "${BUILD_TYPE}"
          --config "${GITHUB_WORKSPACE}"/build/CPackConfig.cmake --verbose
      - env:
          BUILD_TYPE: '${{ matrix.build-type }}'
        name: Create AppImage
        run: |
          wget 'https://github.com/TheAssassin/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage'
          chmod +x linuxdeploy-x86_64.AppImage
          mkdir -p "${GITHUB_WORKSPACE}"/build/AppDir/usr/share/icons/hicolor/scalable/apps
          wget 'https://raw.githubusercontent.com/GNOME/adwaita-icon-theme/refs/heads/master/src/fullcolor/application-x-generic.source.svg' -O "${GITHUB_WORKSPACE}"/build/AppDir/usr/share/icons/hicolor/scalable/apps/application-x-generic.svg
          cat > "${GITHUB_WORKSPACE}"/build/re3-installer.desktop <<EOF
          [Desktop Entry]
          Categories=Utility;
          Exec=re3-installer %u
          Icon=application-x-generic
          Name=re3-installer
          NoDisplay=true
          Type=Application
          Version=1.5
          EOF
          ./linuxdeploy-x86_64.AppImage --appdir "${GITHUB_WORKSPACE}"/build/AppDir --output appimage --desktop-file "${GITHUB_WORKSPACE}"/build/re3-installer.desktop
          mv "${GITHUB_WORKSPACE}"/re3-installer-*.AppImage "${GITHUB_WORKSPACE}"/re3-installer-"${BUILD_TYPE}"-x86_64.AppImage
      - env:
          TAG: ${{ github.ref_name }}
        if: ${{ github.ref_type == 'tag' && matrix.build-type == 'Release' }}
        name: Rename with tag
        run: >-
          mv "${GITHUB_WORKSPACE}"/re3-installer-Release-x86_64.AppImage
          "${GITHUB_WORKSPACE}/re3-installer-${TAG}-x86_64.AppImage"
      - name: 'Upload Artifacts'
        uses: 'actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a'
        with:
          if-no-files-found: error
          name: re3-installer-${{ matrix.build-type }}-Linux
          path: |
            ${{github.workspace}}/re3-installer-*.AppImage
            ${{github.workspace}}/re3-installer-*.zip
      - name: Attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-path: |
            ${{github.workspace}}/re3-installer-*.AppImage
            ${{github.workspace}}/re3-installer-*.zip
      - env:
          GH_TOKEN: ${{ github.token }}
        if: ${{ github.ref_type == 'tag' && matrix.build-type == 'Release' }}
        name: Upload package
        run: |
          shopt -s nullglob
          files=("${GITHUB_WORKSPACE}"/re3-installer-*.AppImage)
          if [[ ${#files[@]} -eq 0 ]]; then
            echo '::error::No package files were found to upload.'
            exit 1
          fi
          if ! gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --draft --generate-notes \
              --title "$GITHUB_REF_NAME" || true
          fi
          gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber
    strategy:
      fail-fast: false
      matrix:
        build-type: [Debug, Release]
  build-macos:
    name: 'Build (macOS)'
    permissions:
      attestations: write
      contents: write
      id-token: write
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: install deps
        run: brew install unshield libcdio
      - env:
          BUILD_TYPE: '${{ matrix.build-type }}'
        run: |
          cmake -S . -B build -DCMAKE_VERBOSE_MAKEFILE=ON \
            -DCMAKE_BUILD_TYPE="${BUILD_TYPE}" \
            -DCMAKE_INSTALL_PREFIX="${GITHUB_WORKSPACE}"/build/prefix
          cmake --build build --config "${BUILD_TYPE}" --verbose
          cmake --install "${GITHUB_WORKSPACE}"/build --config "${BUILD_TYPE}" --verbose
      - env:
          BUILD_TYPE: '${{ matrix.build-type }}'
        name: Package
        run: >-
          cpack -C "${BUILD_TYPE}"
          --config "${GITHUB_WORKSPACE}"/build/CPackConfig.cmake --verbose
      - name: 'Upload Artifacts'
        uses: 'actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a'
        with:
          if-no-files-found: error
          name: re3-installer-${{ matrix.build-type }}-${{ matrix.os }}
          path: |
            ${{github.workspace}}/re3-installer-*.zip
      - name: Attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-path: |
            ${{github.workspace}}/re3-installer-*.zip
      - env:
          GH_TOKEN: ${{ github.token }}
        if: ${{ github.ref_type == 'tag' && matrix.build-type == 'Release' }}
        name: Upload package
        run: |
          shopt -s nullglob
          files=("${GITHUB_WORKSPACE}"/re3-installer-*.zip)
          if [[ ${#files[@]} -eq 0 ]]; then
            echo '::error::No package files were found to upload.'
            exit 1
          fi
          if ! gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --draft --generate-notes \
              --title "$GITHUB_REF_NAME" || true
          fi
          gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber
    strategy:
      fail-fast: false
      matrix:
        build-type: [Debug, Release]
        os: [macos-15-intel, macos-latest]
  build-msys:
    name: 'Build (MSYS2)'
    permissions:
      attestations: write
      contents: write
      id-token: write
    runs-on: ${{matrix.sys.runner}}
    steps:
      - id: fixed_workspace
        name: Fix path
        run: >-
          echo out=$("$env:GITHUB_WORKSPACE" -Replace "\\","/") | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
        shell: 'pwsh'
      - if: matrix.sys.name == 'clangarm64'
        name: Install NSIS via Chocolatey
        run: |
          choco install nsis -y --no-progress
          'C:\Program Files (x86)\NSIS' | Out-File -Append -Encoding utf8 -FilePath $env:GITHUB_PATH
        shell: 'pwsh'
      - uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884
        with:
          install: >-
            make
          msystem: ${{matrix.sys.name}}
          pacboy: >-
            cmake:p libcdio:p ninja:p
            ${{ matrix.sys.name == 'clangarm64' && ' ' || 'nsis:p' }}
            toolchain:p zlib:p
          path-type: ${{ matrix.sys.name == 'clangarm64' && 'inherit' || 'minimal' }}
          update: true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - env:
          BUILD_TYPE: '${{ matrix.build-type }}'
          LTO: '${{ matrix.sys.lto }}'
          WORKSPACE: ${{steps.fixed_workspace.outputs.out}}
        name: Build unshield
        run: |
          curl -Lo 'unshield.tar.gz' 'https://github.com/twogood/unshield/archive/refs/tags/1.6.2.tar.gz'
          tar xf unshield.tar.gz
          cd unshield-1.6.2
          sed -i 's/defined(UNSHIELD_EXPORTS)/defined(UNSHIELD_EXPORT)/' lib/libunshield.h
          mkdir build
          cmake -B ./build -DCMAKE_BUILD_TYPE="${BUILD_TYPE}" \
            -DCMAKE_INSTALL_PREFIX="$WORKSPACE"/build/prefix \
            -DCMAKE_BUILD_WITH_INSTALL_RPATH=ON \
            -DCMAKE_INTERPROCEDURAL_OPTIMIZATION="${LTO}" \
            -DCMAKE_SYSTEM_NAME=Windows -Wno-dev
          cmake --build ./build --config "${BUILD_TYPE}" --verbose
          cmake --install ./build --config "${BUILD_TYPE}" --verbose
        shell: msys2 {0}
      - env:
          BUILD_TYPE: '${{ matrix.build-type }}'
          CPACK_SYSTEM: '${{ matrix.sys.cpack_system }}'
          WORKSPACE: ${{steps.fixed_workspace.outputs.out}}
        name: Configure
        run: >-
          cmake -G Ninja -B "$WORKSPACE"/build
          --install-prefix "$WORKSPACE"/build/prefix
          -DCMAKE_BUILD_TYPE="${BUILD_TYPE}"
          -DCMAKE_PREFIX_PATH="$WORKSPACE"/build/prefix
          -DCPACK_SYSTEM_NAME="${CPACK_SYSTEM}"
        shell: msys2 {0}
      - env:
          WORKSPACE: ${{steps.fixed_workspace.outputs.out}}
        name: Build
        run: cmake --build "$WORKSPACE"/build --verbose
        shell: msys2 {0}
      - env:
          BUILD_TYPE: '${{ matrix.build-type }}'
          WORKSPACE: ${{steps.fixed_workspace.outputs.out}}
        name: Install
        run: >-
          cmake --install "$WORKSPACE"/build
          --config "${BUILD_TYPE}" --verbose
        shell: msys2 {0}
      - env:
          BUILD_TYPE: '${{ matrix.build-type }}'
          WORKSPACE: ${{steps.fixed_workspace.outputs.out}}
        name: Package
        run: >-
          cd "$WORKSPACE"/build &&
          cpack -C "${BUILD_TYPE}" --verbose
        shell: msys2 {0}
      - if: "matrix.build-type == 'Release'"
        name: 'Check for debug runtime linkage'
        run: |
          $markers = @(
            'VCRUNTIME140D',
            'MSVCP140D',
            'VCOMP140D',
            'CONCRT140D',
            'VCCORLIB140D',
            'ucrtbased',
            'MSVCRTD',
            'MSVCPRTD'
          )
          $zip = (Get-ChildItem build/re3-installer-*-Release.zip | Select-Object -First 1).FullName
          Expand-Archive -Path $zip -DestinationPath debugcheck -Force
          $binaries = @(Get-ChildItem debugcheck -Recurse -Include *.dll, *.exe)
          if ($binaries.Count -eq 0) {
            Write-Host "::error::No binaries were found in $zip."
            exit 1
          }
          $failed = $false
          $binaries | ForEach-Object {
            $bytes = [System.IO.File]::ReadAllBytes($_.FullName)
            $text = [System.Text.Encoding]::ASCII.GetString($bytes)
            foreach ($marker in $markers) {
              if ($text.Contains($marker)) {
                Write-Host "::error::$($_.Name) references debug runtime $marker."
                $failed = $true
              }
            }
          }
          if ($failed) {
            exit 1
          }
        shell: pwsh
      - name: 'Upload Artifacts'
        uses: 'actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a'
        with:
          if-no-files-found: error
          name: re3-installer-${{ matrix.build-type }}-${{ matrix.sys.name }}
          path: |
            ${{github.workspace}}/build/re3-installer-*.zip
            ${{github.workspace}}/build/re3-installer-*.exe
      - name: Attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-path: |
            ${{github.workspace}}/build/re3-installer-*.zip
            ${{github.workspace}}/build/re3-installer-*.exe
      - env:
          GH_TOKEN: ${{ github.token }}
          WORKSPACE: ${{steps.fixed_workspace.outputs.out}}
        if: ${{ github.ref_type == 'tag' && matrix.sys.release && matrix.build-type == 'Release' }}
        name: Upload package
        run: |
          shopt -s nullglob
          files=(
            "$WORKSPACE"/build/re3-installer-*.zip
            "$WORKSPACE"/build/re3-installer-*.exe
          )
          if [[ ${#files[@]} -eq 0 ]]; then
            echo '::error::No package files were found to upload.'
            exit 1
          fi
          if ! gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --draft --generate-notes \
              --title "$GITHUB_REF_NAME" || true
          fi
          gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        build-type: [Debug, Release]
        sys:
          - cpack_system: win64
            env: x86_64
            lto: 'TRUE'
            name: mingw64
            release: false
            runner: windows-latest
          - cpack_system: win64
            env: ucrt-x86_64
            lto: 'TRUE'
            name: ucrt64
            release: false
            runner: windows-latest
          - cpack_system: winarm64
            env: clang-aarch64
            lto: 'TRUE'
            name: clangarm64
            release: true
            runner: windows-11-arm
name: Build
'on':
  pull_request:
    branches: [master]
  push:
    branches: [master]
    tags:
      - 'v*.*.*'
permissions:
  contents: read
