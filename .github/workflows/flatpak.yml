jobs:
  build:
    container:
      image: 'ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-24.08'
      options: '--privileged'
    permissions:
      attestations: 'write'
      contents: 'read'
      id-token: 'write'
    runs-on: '${{ matrix.system.image }}'
    steps:
      - uses: 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1'
        with:
          persist-credentials: false
      - id: 'flatpak_bundle'
        name: 'Set Flatpak bundle filename'
        run: |
          version=$(jq -r '.version' package.json)
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "filename=sh.tat.re3-installer-${version}-${{ matrix.system.arch }}.flatpak" >> "$GITHUB_OUTPUT"
      - name: 'Build Flatpak'
        uses: 'flatpak/flatpak-github-actions/flatpak-builder@401fe28a8384095fc1531b9d320b292f0ee45adb'
        with:
          arch: '${{ matrix.system.arch }}'
          bundle: '${{ steps.flatpak_bundle.outputs.filename }}'
          manifest-path: 'sh.tat.re3-installer.yml'
      - name: 'Upload Artifacts'
        uses: 'actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a'
        with:
          if-no-files-found: 'error'
          name: 'sh.tat.re3-installer-${{ steps.flatpak_bundle.outputs.version }}-${{ matrix.system.arch }}'
          path: '${{ steps.flatpak_bundle.outputs.filename }}'
      - name: 'Attest'
        uses: 'actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6'
        with:
          subject-path: '${{ steps.flatpak_bundle.outputs.filename }}'
    strategy:
      matrix:
        system:
          - arch: 'x86_64'
            image: 'ubuntu-latest'
          - arch: 'aarch64'
            image: 'ubuntu-24.04-arm'
  release:
    if: "github.ref_type == 'tag'"
    needs: 'build'
    permissions:
      actions: 'read'
      contents: 'write'
    runs-on: 'ubuntu-latest'
    steps:
      - env:
          GH_REPO: '${{ github.repository }}'
          GH_TOKEN: '${{ github.token }}'
        name: 'Upload package'
        run: |
          gh run download "$GITHUB_RUN_ID" --dir bundles
          shopt -s globstar nullglob
          files=(bundles/**/*.flatpak)
          if [[ ${#files[@]} -eq 0 ]]; then
            echo '::error::No package files were found to upload.'
            exit 1
          fi
          if ! gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --draft --generate-notes \
              --title "$GITHUB_REF_NAME" || true
          fi
          gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber
name: 'Flatpak'
'on':
  push:
    branches:
      - 'master'
    paths:
      - '.github/workflows/flatpak.yml'
      - 'CMakeLists.txt'
      - 'include/**'
      - 'sh.tat.re3-installer.yml'
      - 'src/**'
      - 'vcpkg.json'
    tags:
      - 'v*.*.*'
permissions:
  contents: 'read'
