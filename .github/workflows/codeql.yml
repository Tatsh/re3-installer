jobs:
  analyze:
    name: 'Analyze'
    permissions:
      actions: 'read'
      contents: 'read'
      security-events: 'write'
    runs-on: 'ubuntu-latest'
    steps:
      - name: 'Checkout repository'
        uses: 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1'
        with:
          persist-credentials: false
      - name: 'Initialize CodeQL'
        uses: 'github/codeql-action/init@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28'
        with:
          languages: '${{ matrix.language }}'
      - name: Install dependencies
        run: sudo apt-get install -y lcov libunshield-dev libcdio-dev libiso9660-dev libcmocka-dev
      - name: Build
        run: |
          cmake -DCMAKE_BUILD_TYPE=${{matrix.build-type}} -B ${{github.workspace}}/build -DBUILD_TESTS=ON
          cmake --build ${{github.workspace}}/build --config ${{matrix.build-type}} --verbose
      - name: 'Perform CodeQL Analysis'
        uses: 'github/codeql-action/analyze@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28'
        with:
          category: '/language:${{matrix.language}}'
    strategy:
      fail-fast: false
      matrix:
        language:
          - 'cpp'
        build-type: [Debug, Release]
name: 'CodeQL'
'on':
  pull_request:
    branches:
      - 'master'
  push:
    branches:
      - 'master'
  schedule:
    - cron: '15 4 * * 3'
