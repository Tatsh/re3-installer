concurrency:
  cancel-in-progress: true
  group: '${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}'
jobs:
  analyze:
    name: 'Analyze'
    permissions:
      actions: 'read'
      contents: 'read'
      security-events: 'write'
    runs-on: 'ubuntu-latest'
    steps:
      - name: 'Checkout repository'
        uses: 'actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1'
        with:
          persist-credentials: false
      - name: 'Initialize CodeQL'
        uses: 'github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370'
        with:
          languages: '${{ matrix.language }}'
      - name: Install dependencies
        run: sudo apt-get install -y lcov libunshield-dev libcdio-dev libiso9660-dev libcmocka-dev
      - env:
          BUILD_TYPE: '${{ matrix.build-type }}'
        name: Build
        run: |
          cmake -DCMAKE_BUILD_TYPE="${BUILD_TYPE}" -B "${GITHUB_WORKSPACE}"/build -DBUILD_TESTS=ON
          cmake --build "${GITHUB_WORKSPACE}"/build --config "${BUILD_TYPE}" --verbose
      - name: 'Perform CodeQL Analysis'
        uses: 'github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370'
        with:
          output: '${{ runner.temp }}/codeql-sarif'
          upload: false
          category: '/language:${{matrix.language}}'
      - if: matrix.language == 'c-cpp' || matrix.language == 'cpp'
        name: Restrict native findings to project sources
        run: python3 .github/scripts/static-analysis.py --sarif "$RUNNER_TEMP/codeql-sarif"
      - name: Upload CodeQL results
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370
        with:
          category: /language:${{matrix.language}}
          sarif_file: ${{ runner.temp }}/codeql-sarif
    strategy:
      fail-fast: false
      matrix:
        language:
          - 'cpp'
        build-type: [Debug, Release]
name: 'CodeQL'
'on':
  pull_request:
    branches:
      - 'master'
  push:
    branches:
      - 'master'
  schedule:
    - cron: '15 4 * * 3'
permissions: {}
